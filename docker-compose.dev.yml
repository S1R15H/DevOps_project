services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '6789:6789'
    env_file:
      - .env.development
    depends_on:
      - neon-local
    volumes:
      - ./src:/app/src

  neon-local:
    image: neondatabase/neon_local:latest
    ports:
      - '5433:5432'
    env_file:
      - .env.development
